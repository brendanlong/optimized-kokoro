[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/brendanlong/optimized-kokoro"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The spaCy port's parity tests tag millions of tokens; unoptimized, they take minutes.
[profile.dev.package.kokoro-spacy-en]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
# The Japanese parity tests analyze tens of thousands of texts; unoptimized, they take minutes.
[profile.dev.package.kokoro-g2p-ja]
opt-level = 3
