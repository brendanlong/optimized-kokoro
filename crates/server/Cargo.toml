[package]
name = "kokoro-server"
version = "0.1.0"
description = "HTTP front for Kokoro TTS: request validation, text pipeline, scheduling and PCM streaming over a sandboxed GPU worker"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kokoro-text = { path = "../text" }
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
