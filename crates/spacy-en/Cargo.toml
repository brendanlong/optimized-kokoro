[package]
name = "kokoro-spacy-en"
version = "0.1.0"
description = "spaCy en_core_web_sm's tokenizer and tagger (tok2vec + tagger), ported to Rust for exact parity"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# Without the default `avx512` feature: its kernel is the newest and least used, and the hosts
# we run on (Zen 3) have none, so AVX-512 machines then run the same AVX2+FMA kernel as ours.
matrixmultiply = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kokoro-reference = { path = "../reference" }
