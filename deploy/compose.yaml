# The production deployment on the host's system Docker: the GPU worker, the Rust server and the demo
# page, each in gVisor as nobody (65534), with no capabilities and a read-only root. deploy/install.sh
# and deploy/update.sh copy this file to /srv/optimized-kokoro/releases/RELEASE/compose.yaml next to a
# .env that sets KOKORO_ROOT, KOKORO_RELEASE, KOKORO_UNIDIC_FILE, COMPOSE_PROJECT_NAME and the
# settings from /srv/optimized-kokoro/settings.env; /srv/optimized-kokoro/current points at the
# release that runs. See deploy/README.md.
#
# Each release is its own Compose project, optimized-kokoro-REL (COMPOSE_PROJECT_NAME in its .env,
# so there's no name: here), with its own socket volume and network. update.sh starts a new
# release's worker (no network) next to the running release, then replaces the old server, demo
# and tunnel with the new ones. The networks all have the same subnet, so the addresses below
# (the tunnel's ingress is 172.30.88.2:8880) never change; update.sh removes the old network before
# the new one is made, since two networks can't share a subnet.
#
#   sudo docker compose -f /srv/optimized-kokoro/current/compose.yaml ps|logs -f|restart
#
# The runtimes are runsc with different flags, which install.sh and update.sh put in
# /etc/docker/daemon.json (kokoro_runtimes in lib.sh):
#   runsc-kokoro-uds-create  runsc --directfs=false --host-uds=create   the worker
#   runsc-kokoro-uds-open    runsc --directfs=false --host-uds=open     the server
#   runsc-kokoro-no-uds      runsc --directfs=false                     the demo and the tunnel
# --directfs=false: under rootful Docker the sandbox otherwise runs as root in the host's user
#   namespace; with it, the sentry runs as nobody in an empty user namespace and all file access goes
#   through the gofer.
# --host-uds: each container is its own gVisor kernel, so a Unix socket the worker binds in the
#   shared volume only reaches the server as a real host socket. The worker binds it (create), the
#   server connects to it (open), and the others have no host sockets at all.
# GPU support turns on by itself when the spec has NVIDIA devices (from CDI, see the worker).

x-hardening: &hardening
  restart: unless-stopped
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}

services:
  worker:
    <<: *hardening
    image: optimized-kokoro-worker:${KOKORO_RELEASE:?}
    runtime: runsc-kokoro-uds-create
    network_mode: none
    # The same flags must go to the export run (lib.sh), or the cache seed won't match.
    command: ["--max-batch", "${KOKORO_MAX_BATCH:?}", "--max-chunk-seconds", "${KOKORO_MAX_CHUNK_SECONDS:?}"]
    environment:
      KOKORO_CACHE_SEED: /cache-seed
      # The device comes from CDI; "void" keeps runsc off the legacy nvidia-container-cli path.
      NVIDIA_VISIBLE_DEVICES: void
    # Triton and Inductor write their caches there and dlopen the launcher they compile (exec).
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g,mode=1777
    volumes:
      - {type: volume, source: sock, target: /run/kokoro, volume: {nocopy: true}}
      - {type: bind, source: "${KOKORO_ROOT:?}/models", target: /models, read_only: true}
      - {type: bind, source: "${KOKORO_ROOT:?}/releases/${KOKORO_RELEASE:?}/cache-seed", target: /cache-seed, read_only: true}
    # Host RAM, CPU and threads for the sandbox (worker/run.sh's limits). GPU memory isn't covered.
    mem_limit: 12g
    memswap_limit: 12g
    cpus: 4
    pids_limit: 1024
    stop_grace_period: 30s
    # One GPU through Docker's CDI support (the NVIDIA Container Toolkit's spec), as worker/run.sh
    # does with podman. Not --gpus: with an image that sets NVIDIA_VISIBLE_DEVICES=all (every CUDA
    # base image), that takes the legacy hook path, which fails under runsc release-20261102.0 with
    # "Error reading mounts file: error unmarshaling mounts: unexpected end of JSON input".
    devices: ["nvidia.com/gpu=${KOKORO_GPU:?}"]

  server:
    <<: *hardening
    image: optimized-kokoro-server:${KOKORO_RELEASE:?}
    runtime: runsc-kokoro-uds-open
    command: ["--config", "/run/secrets/server.toml"]
    environment:
      RUST_LOG: info
      # Mapped the first time a request needs Japanese. Named by checksum, set per release (lib.sh).
      KOKORO_UNIDIC: /unidic/${KOKORO_UNIDIC_FILE:?}
    secrets:
      - {source: server_config, target: server.toml}
    volumes:
      - {type: volume, source: sock, target: /run/kokoro, volume: {nocopy: true}}
      - {type: bind, source: "${KOKORO_ROOT:?}/unidic", target: /unidic, read_only: true}
    networks:
      kokoro: {ipv4_address: 172.30.88.2}
    # KOKORO_LISTEN in settings.env (default 127.0.0.1:8880).
    ports: ["${KOKORO_LISTEN:?}:8880"]
    # max_connections (default 4096) needs about one file descriptor per connection.
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    # About 110 MB resident without Japanese; UniDic adds its 516 MB when mapped.
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256
    stop_grace_period: 15s

  demo:
    <<: *hardening
    image: optimized-kokoro-demo:${KOKORO_RELEASE:?}
    runtime: runsc-kokoro-no-uds
    # An address, not a name: Docker's embedded DNS doesn't work under runsc.
    command: ["--listen", "0.0.0.0:25436", "--upstream", "http://172.30.88.2:8880", "--key-file", "/run/secrets/demo.key"]
    secrets:
      - {source: demo_key, target: demo.key}
    networks:
      kokoro: {ipv4_address: 172.30.88.3}
    # KOKORO_DEMO_LISTEN in settings.env (default 127.0.0.1:25436).
    ports: ["${KOKORO_DEMO_LISTEN:?}:25436"]
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128

  # A Cloudflare Tunnel to the server, off unless settings.env has KOKORO_CLOUDFLARED=1 (which puts
  # COMPOSE_PROFILES=cloudflared in the release's .env). The tunnel's public hostname must point at
  # http://172.30.88.2:8880: Docker's embedded DNS doesn't resolve service names under runsc, which
  # is also why cloudflared gets a resolv.conf. Put Cloudflare Access (a service token) in front of
  # the hostname, so unauthenticated traffic never reaches the server (crates/server/src/config.rs).
  cloudflared:
    <<: *hardening
    profiles: [cloudflared]
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    runtime: runsc-kokoro-no-uds
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared.token
    secrets:
      - {source: cloudflared_token, target: cloudflared.token}
    networks:
      kokoro: {ipv4_address: 172.30.88.4}
    volumes:
      - {type: bind, source: "${KOKORO_ROOT:?}/resolv.conf", target: /etc/resolv.conf, read_only: true}
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    depends_on: [server]

volumes:
  # A tmpfs owned by nobody, mounted on the host while either container uses it; it only ever holds
  # worker.sock (mode 0660), which the worker replaces when it starts. One per release (project), so
  # a new worker never touches the running one's socket.
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65534,gid=65534,mode=0700,size=1m

networks:
  # One per release, all with this subnet, so only one exists at a time (update.sh's stop_front).
  kokoro:
    ipam:
      config:
        - subnet: 172.30.88.0/24

# Not swarm, so Docker bind-mounts these files as they are: root:65534, mode 0640 (install.sh).
secrets:
  server_config:
    file: ${KOKORO_ROOT:?}/secrets/server.toml
  demo_key:
    file: ${KOKORO_ROOT:?}/secrets/demo.key
  cloudflared_token:
    file: ${KOKORO_ROOT:?}/secrets/cloudflared.token
