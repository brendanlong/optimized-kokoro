# gpuc submit bench/job_ab.yaml --host local   (from worker/). Untracked input it expects:
# bench/bin/main/worker (git archive origin/main worker, unpacked there).
name: kokoro-ab
setup: uv sync --frozen
command: bash bench/job_ab.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 60
max_runtime_min: 180
