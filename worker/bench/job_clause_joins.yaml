# gpuc submit bench/job_clause_joins.yaml --host local   (from worker/). Untracked inputs it expects:
# bench/bin/kokoro-server-LABEL for each label in SERVERS, and bench/bin/espeak-ng-data, with
# bench/bin/espeak-data-link holding the espeak-ng-data path the binaries were built with.
name: kokoro-clause-joins
setup: uv sync --frozen
command: bash bench/job_clause_joins.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 15
max_runtime_min: 60
