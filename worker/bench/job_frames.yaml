# gpuc submit bench/job_frames.yaml --host local   (from worker/): bench/frames_per_id.py on the corpus.
name: kokoro-frames-per-id
setup: uv sync --frozen
command: bash bench/job_frames.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 20
max_runtime_min: 90
