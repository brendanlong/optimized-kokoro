# gpuc submit worker/bench/job_frames.yaml --host local   (from the repository root, for
# reference/fixtures): bench/frames_per_id.py.
name: kokoro-frames-per-id
setup: cd worker && uv sync --frozen
command: bash worker/bench/job_frames.sh
python: worker/.venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
outputs:
  - path: worker/results
priority: 40
estimated_runtime_min: 30
max_runtime_min: 120
