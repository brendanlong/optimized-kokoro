# gpuc submit bench/job_lstm_free.yaml --host local   (from worker/). Untracked inputs it expects:
# bench/bin/main/worker (git archive origin/main worker, unpacked there) and bench/bin/students.pt.
name: kokoro-lstm-free
setup: uv sync --frozen
command: bash bench/job_lstm_free.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 90
max_runtime_min: 240
