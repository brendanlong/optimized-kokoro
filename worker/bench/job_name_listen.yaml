# gpuc submit bench/job_name_listen.yaml --host local   (from worker/); see job_name_listen.sh for its inputs.
name: kokoro-name-listen
setup: uv sync --frozen
command: bash bench/job_name_listen.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 5
max_runtime_min: 30
