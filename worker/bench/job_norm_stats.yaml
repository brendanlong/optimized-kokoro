# gpuc submit bench/job_norm_stats.yaml --host local   (from worker/)
name: kokoro-norm-stats
setup: uv sync --frozen
command: mkdir -p results && M=${GPUC_DATA_DIR}/kokoro-worker-models && { [ -f $M/voices.safetensors ] || .venv/bin/python -m kokoro_worker.convert $M; } && .venv/bin/python bench/norm_stats.py $M --clips results/clips --json results/norm_stats.json 2>&1 | tee results/norm_stats.txt
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 30
max_runtime_min: 120
