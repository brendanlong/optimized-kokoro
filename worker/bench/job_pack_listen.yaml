# gpuc submit bench/job_pack_listen.yaml --host local   (from worker/); see job_pack_listen.sh for its inputs.
name: kokoro-pack-listen
setup: uv sync --frozen
command: bash bench/job_pack_listen.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 15
max_runtime_min: 60
