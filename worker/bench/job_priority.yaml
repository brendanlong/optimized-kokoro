# gpuc submit bench/job_priority.yaml --host local   (from worker/). Untracked inputs it expects: a
# kokoro-server binary built from this branch in bench/bin/, with crates/espeak-ng/espeak-ng-data
# copied next to it, and ESPEAK_DATA_LINK set to the espeak-ng-data path the binary was built with.
name: kokoro-priority-load
setup: uv sync --frozen
command: KOKORO_SERVER_BIN=$PWD/bench/bin/kokoro-server bash bench/job_priority.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  ESPEAK_DATA_LINK: /home/claude/worktrees/decf45d1-3ba3-4e7a-b872-21145ffc217e/optimized-kokoro/.claude/worktrees/agent-a6938cd273512b1d9/crates/espeak-ng/espeak-ng-data
outputs:
  - path: results
priority: 40
estimated_runtime_min: 45
max_runtime_min: 120
