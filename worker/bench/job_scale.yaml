# gpuc submit bench/job_scale.yaml --runpod --gpu "H100 SXM" --max-price 4.10 --idle-min 5   (from worker/)
name: kokoro-batch-scale
setup: uvx uv@0.11.4 sync --frozen
command: bash bench/job_scale.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
  SCALE_ARGS: "--profile-batches 1 8 64 256"
secrets: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
outputs:
  - path: results
    s3: s3://brendanlong-experiments/optimized-kokoro/{job_id}/results
sync_interval_s: 120
priority: 40
estimated_runtime_min: 70
max_runtime_min: 150
