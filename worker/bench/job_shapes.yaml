# gpuc submit bench/job_shapes.yaml --host local   (from worker/)
name: kokoro-worker-shapes
setup: uv sync --frozen
command: bash bench/job_shapes.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 25
max_runtime_min: 90
