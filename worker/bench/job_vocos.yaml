# gpuc submit bench/job_vocos.yaml --host local   (from worker/). Untracked inputs it expects:
# bench/bin/main/worker (git archive origin/main worker, unpacked there) and bench/bin/{students,frame_side,decoder}.pt.
name: kokoro-vocos-worker
setup: uv sync --frozen
command: bash bench/job_vocos.sh
python: .venv/bin/python
gpus: 1
env:
  REQUIRE_CUDA: "1"
outputs:
  - path: results
priority: 40
estimated_runtime_min: 90
max_runtime_min: 240
