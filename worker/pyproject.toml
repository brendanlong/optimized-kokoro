[project]
name = "kokoro-worker"
version = "0.1.0"
description = "Sandboxed Kokoro-82M GPU worker: validated integer frames in, PCM out"
license = "Apache-2.0"
requires-python = "==3.12.13"
# Same torch/triton/transformers as the deployed Kokoro-FastAPI image, so speed and numerics match it.
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "transformers==5.14.1",
    "huggingface-hub==1.6.0",
    "loguru==0.7.3",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "kokoro",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
# kokoro's G2P (misaki and spaCy/espeak under it) never runs in the worker, which gets phoneme ids,
# not text. Only kokoro's model modules are imported (see kokoro_worker/model.py).
override-dependencies = ["misaki ; sys_platform == 'never'"]

[tool.uv.sources]
kokoro = { git = "https://github.com/brendanlong/kokoro", rev = "66c8ed5108f39470c75dff01280f9fc2c9ccd521" }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
